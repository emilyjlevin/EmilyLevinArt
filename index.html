<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emily Levin | Oil Paintings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f5f0;
      color: #222;
      font-family: Arial, sans-serif;
    }

    header {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 24px 35px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      font-weight: normal;
    }

    .subtitle {
      margin: 0;
      font-size: 18px;
      font-style: italic;
    }

    .gallery {
      max-width: 1100px;
      margin: 0 auto;
      padding: 15px 24px 60px;
      columns: 3 280px;
      column-gap: 24px;
    }

    figure {
      margin: 0 0 24px;
      break-inside: avoid;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      padding-top: 8px;
      font-size: 15px;
      line-height: 1.4;
    }

    .title {
      display: block;
      font-style: italic;
    }

    .availability {
      display: inline-block;
      margin-top: 4px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .contact {
      max-width: 760px;
      margin: 0 auto;
      padding: 10px 24px 60px;
      text-align: center;
      font-size: 17px;
      line-height: 1.7;
    }

    .contact h2 {
      font-weight: normal;
      font-size: 28px;
      margin-bottom: 12px;
    }

    footer {
      padding: 30px 24px;
      text-align: center;
      font-size: 13px;
      color: #666;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>
  <header>
    <h1>Oil paintings</h1>
    <p class="subtitle">Welcome</p>
  </header>

  <main>
    <section class="gallery">

      <figure>
        <img src="paintings/FaceOriginal_2021_reduced1800_crop.jpeg" alt="Oil painting by Emily Levin">
        <figcaption>
          <span class="title">Painting Title</span>
          Oil on canvas, 16 × 20 inches, 2026<br>
          <span class="availability">Available</span>
        </figcaption>
      </figure>

      <figure>
        <img src="paintings/painting2.jpg" alt="Oil painting by Emily Levin">
        <figcaption>
          <span class="title">Painting Title</span>
          Oil on canvas, 12 × 16 inches, 2026<br>
          <span class="availability">Sold</span>
        </figcaption>
      </figure>

      <figure>
        <img src="paintings/painting3.jpg" alt="Oil painting by Emily Levin">
        <figcaption>
          <span class="title">Painting Title</span>
          Oil on canvas, 18 × 24 inches, 2025<br>
          <span class="availability">Private Collection</span>
        </figcaption>
      </figure>

      <figure>
        <img src="paintings/painting4.jpg" alt="Oil painting by Emily Levin">
        <figcaption>
          <span class="title">Painting Title</span>
          Oil on canvas, 11 × 14 inches, 2025<br>
          <span class="availability">Not Available</span>
        </figcaption>
      </figure>

    </section>

    <section class="contact">
      <h2>Contact</h2>
      <p>
        <a href="mailto:ejlevin3@gmail.com">ejlevin3@gmail.com</a>
      </p>
    </section>
  </main>

  <footer>
    © 2026 Emily Levin
  </footer>
</body>
</html>
