<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emily Levin | Oil Paintings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Helvetica, Arial, sans-serif;
    }

    header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 48px 24px 32px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 7px 0 0;
      font-size: 14px;
      color: #777777;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 60px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 42px 24px;
      align-items: start;
    }

    figure {
      margin: 0;
    }

    figure img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      padding-top: 6px;
      font-size: 11px;
      line-height: 1.25;
      color: #666666;
    }

    .title {
      display: block;
      margin-bottom: 1px;
      font-size: 12px;
      font-weight: 500;
      color: #111111;
    }

    .details {
      display: block;
    }

    .availability {
      display: block;
      margin-top: 1px;
      font-size: 9px;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .contact {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid #e5e5e5;
      text-align: center;
    }

    .contact h2 {
      margin: 0 0 8px;
      font-size: 16px;
      font-weight: 500;
    }

    .contact a {
      color: #111111;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    footer {
      padding: 0 24px 36px;
      text-align: center;
      font-size: 10px;
      color: #999999;
    }

    @media (max-width: 850px) {
      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 550px) {
      header {
        padding: 34px 18px 24px;
      }

      h1 {
        font-size: 30px;
      }

      main {
        padding: 14px 18px 48px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Oil paintings</h1>
    <p class="subtitle">Emily Levin</p>
  </header>

  <main>

    <section class="gallery">

      <figure>
        <img
          src="paintings/FaceOriginal_2021.jpeg"
          alt="Untitled oil painting by Emily Levin"
        >

        <figcaption>
          <span class="title">Untitled</span>
          <span class="details">Oil on canvas · 11 × 14 inches · 2021</span>
          <span class="availability">Not for sale</span>
        </figcaption>
      </figure>

      <figure>
        <img
          src="paintings/PicassoWoman_2026.jpeg"
          alt="Portrait study after Picasso by Emily Levin"
        >

        <figcaption>
          <span class="title">Portrait Study after Picasso</span>
          <span class="details">Oil on canvas · 2026</span>
          <span class="availability">Available</span>
        </figcaption>
      </figure>

    </section>

    <section class="contact">
      <h2>Contact</h2>
      <a href="mailto:ejlevin3@gmail.com">ejlevin3@gmail.com</a>
    </section>

  </main>

  <footer>
    © 2026 Emily Levin
  </footer>

</body>
</html>
